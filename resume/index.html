<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta property="og:title" content="mence.dev | Resume">
    <meta property="og:description" content="Software Engineer with experience in web, desktop, DevOps and game development.">
    <meta property="og:image" content="https://github.com/lucasmence.png">
    <meta property="og:url" content="https://mence.dev/resume">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#282a36">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lucas@mence.dev:~/resume$</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="../img/favicon.png" type="image/png">
  </head>
  <body>
    <div class="crt-overlay"></div>
    <main id="main">
      <div class="statusbar">
        <a class="back-link" id="back-link" href="../">&larr; <span id="txt-back">back to ~</span></a>
        <div class="statusbar-right">
          <div class="lang-switcher">
            <span class="label">lang:</span>
            <a href="?lang=en" id="lang-en">EN</a>
            <span style="color:var(--border);">|</span>
            <a href="?lang=br" id="lang-br">BR</a>
          </div>
          <span id="clock">--:--:--</span>
        </div>
      </div>
      <div class="page-title" id="txt-page-title">~/resume$ cat resume.pdf</div>
      <div class="resume-wrap">
        <div class="term-wrap resume-window">
          <div class="term-screen resume-screen">
            <div class="line cmd"><span class="cmd-prompt-group"><span class="prompt">lucas@mence.dev</span><span class="sym">:</span><span class="path">~</span><span class="sym">$</span></span> <span id="txt-cmd-echo">cat resume.pdf</span></div>
            <div class="pdf-frame-wrap">
              <div id="pdf-viewer" class="pdf-viewer" aria-label="Resume preview"></div>
            </div>
          </div>
        </div>
        <div class="download-row">
          <a class="ascii-btn" id="btn-download" download></a>
        </div>
      </div>
      <footer>© <span id="year-start"></span> - <span id="year-current"></span> mence.dev</footer>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
