<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta property="og:title" content="mence.dev">
  <meta property="og:description" content="Software Engineer with experience in web, desktop, DevOps and game development.">
  <meta property="og:image" content="https://github.com/lucasmence.png">
  <meta property="og:url" content="https://mence.dev/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#282a36">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucas@mence.dev:~$</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <link rel="icon" href="img/favicon.png" type="image/png">
</head>
<body>
  <div class="crt-overlay"></div>
  <main id="main">
    <div class="statusbar">
      <span class="statusbar-title">lucas@mence.dev <span class="dim">: ~/aboutme</span></span>
      <div class="statusbar-right">
        <div class="lang-switcher">
          <span class="label">lang:</span>
          <a href="?lang=en" id="lang-en">EN</a>
          <span style="color:var(--border);">|</span>
          <a href="?lang=br" id="lang-br">BR</a>
        </div>
        <span id="clock">--:--:--</span>
      </div>
    </div>
    <div id="win-term" class="term-wrap">
      <div class="term-screen" tabindex="-1">
        <div class="output"></div>
        <div class="inputline">
          <span class="prompt">lucas@mence.dev</span><span class="sym">:</span><span class="path prompt-path">~</span><span class="sym">$</span>
          <input class="cmdline" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"/>
        </div>
      </div>
    </div>
    <footer>© <span id="year-start"></span> - <span id="year-current"></span> mence.dev</footer>
  </main>
  <script src="js/index.js"></script>
</body>
</html>
