<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mence Games</title>
  <link rel="icon" href="../img/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
  <link href="css/tooltip.css" rel="stylesheet">
</head>
<body>
  <div class="logo">
    <a href="https://linktr.ee/lucasmence" target="_blank"><img src="img/mence-logo.png" alt="Mence"></a>
  </div>

  <div class="gallery-container">
    <div class="slider-wrapper">
      <div class="side-image" id="left-preview" onclick="prevSlide()"></div>
      <div class="main-image" id="main-image"></div>
      <div class="side-image" id="right-preview" onclick="nextSlide()"></div>
    </div>

    <div class="navigation">
      <button class="nav-btn" onclick="prevSlide()">&#10094;</button>
      <button class="nav-btn" onclick="nextSlide()">&#10095;</button>
    </div>

    <div class="gif-image" id="gif-preview"></div>
    <div class="tooltip-group">
      <div class="tooltip-description">
        <div class="label-description">
          <label id="label-description"></label>
        </div>
      </div>
    </div>

  </div>

  <footer>
    © 2022-2025 <a style="color: white;" href="https://linktr.ee/lucasmence" target="_blank">Mence</a>
  </footer>

  <script>
    const imageData = [
      
      {
        url: "../img/projects/protocol-undeath.png",
        caption: "Protocol Undeath",
        link: "https://lucasmence.itch.io/protocol-undeath",
        gif: "../img/projects/gifs/protocol-undeath.gif",
        tooltip: `A virus released from the glaciers has spread across the world. You must find your way through the city to survive against the infected.<br/><br/>
                  Collect cash, weapons, and equipment by destroying barrels or simply buy them from shops. Learn to deal with every type of threat that appears in front of you in this procedurally generated game.
                  <br/><br/>
                  <strong>Available for free on <a style="color: white;" href="https://lucasmence.itch.io/protocol-undeath" target="_blank">itch.io</a></strong>`
      },
      {
        url: "../img/projects/boltcraft-ii.png",
        caption: "Boltcraft II",
        link: "https://lucasmence.itch.io/boltcraft-ii-redux-edition",
        gif: "../img/projects/gifs/boltcraft-ii.gif",
        tooltip: `An action <strong>hack'n'slash</strong> combat containing skills with unique natures that can synergize with other skills in the most diverse combinations.
                  <br/><br/>
                  With each new adventure started, a new map will be generated (<strong>procedural generation</strong>), learn to use bushes and walls to outwit enemies and use the terrain to your advantage.
                  <br/><br/>
                  <strong>Available for free on <a style="color: white;" href="https://lucasmence.itch.io/boltcraft-ii-redux-edition" target="_blank">itch.io</a></strong>`
      },
      {
        url: "../img/projects/wizardry-duels.png",
        caption: "Wizardry Duels",
        link: "https://lucasmence.itch.io/wizardry-duels",
        gif: "../img/projects/gifs/wizardry-duels-1.gif",
        tooltip: `Face another player in this PvP arena where 2 players battle using 3 unique spells: <strong>Icy Spear</strong>, <strong>Blink</strong>, and <strong>Thunderbolt</strong>.
                  <br/><br/>
                  I developed this game as a prototype featuring <strong>multiplayer</strong> functionality.<br/> 
                  Packet loss and slow connections may cause issues such as desync during gameplay.<br/>
                  This game supports local network connections using UDP protocol. 
                  <br/><br/>
                  <strong>Available for free on <a style="color: white;" href="https://lucasmence.itch.io/wizardry-duels" target="_blank">itch.io</a></strong>`
      },
      {
        url: "../img/projects/boltcraft.jpg",
        caption: "Boltcraft",
        link: "https://store.steampowered.com/app/2005930/Boltcraft/",
        gif: "../img/projects/gifs/boltcraft-classic.gif",
        tooltip: `Boltcraft is an action <strong>hack'n'slash</strong> combat that has a lot of inspiration from <strong>Warcraft III</strong> Custom Games and MOBAs like <strong>Dota 2</strong> and <strong>League of Legends</strong>.
                  <br/><br/>
                  Choose one of <strong>3 classes</strong> with unique skills and traits to start the adventure. Visit the <strong>6 regions</strong> present in the adventure with a unique diversity of enemies.
                  <br/><br/>
                  <strong>Available on <a style="color: white;" href="https://store.steampowered.com/app/2005930/Boltcraft/" target="_blank">Steam</a></strong>`
      }
    ];

    let currentIndex = 0;

    const mainImageContainer = document.getElementById("main-image");
    const leftPreview = document.getElementById("left-preview");
    const rightPreview = document.getElementById("right-preview");
    const gifImageContainer = document.getElementById("gif-preview");
    const labelDescription = document.getElementById("label-description");

    function renderSlider() {
      const leftIndex = (currentIndex - 1 + imageData.length) % imageData.length;
      const rightIndex = (currentIndex + 1) % imageData.length;

      mainImageContainer.innerHTML = `
        <a href="${imageData[currentIndex].link}" target="_blank"><img src="${imageData[currentIndex].url}" alt="main-img"></a>
      `;
      leftPreview.innerHTML = `<img src="${imageData[leftIndex].url}" alt="previous-img">`;
      rightPreview.innerHTML = `<img src="${imageData[rightIndex].url}" alt="next-img">`;

      gifImageContainer.innerHTML = `
        <a href="${imageData[currentIndex].link}" target="_blank"><img style="width='200px' height='100px'" src="${imageData[currentIndex].gif}"></a>
      `

      labelDescription.innerHTML = `
      ${imageData[currentIndex].tooltip}
      `
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % imageData.length;
      renderSlider();
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + imageData.length) % imageData.length;
      renderSlider();
    }

    setInterval(nextSlide, 10000);
    renderSlider();
  </script>
</body>
</html>
